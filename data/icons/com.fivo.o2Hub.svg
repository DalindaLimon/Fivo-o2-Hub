    <path d="M 0 -11 L 9.5 -5.5 L 9.5 5.5 L 0 11 L -9.5 5.5 L -9.5 -5.5 Z" fill="#2ec5ff" filter="url(#glow)" opacity="0.95"/>
    <path d="M 0 -8.5 L 7.4 -4.25 L 7.4 4.25 L 0 8.5 L -7.4 4.25 L -7.4 -4.25 Z" fill="#0d0f12"/>
    <path d="M 0 -6 L 5.2 -3 L 5.2 3 L 0 6 L -5.2 3 L -5.2 -3 Z" fill="none" stroke="#8fe6ff" stroke-width="2"/>
