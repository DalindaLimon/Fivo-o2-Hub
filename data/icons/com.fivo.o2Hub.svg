      M 212 12 L 228 56 L 262 56 L 285 10 L 300 28 L 385 80 L 408 200 L 418 300
      L 424 384 L 440 420 L 447 500 C 452 560 447 630 425 670 C 400 712 350 735 280 732
      C 200 728 130 690 80 645 C 40 620 14 580 12 520 L 14 400 C 18 360 30 335 48 318
      L 66 276 L 58 250 L 62 176 L 78 150 L 100 78 L 130 50 Z"/>
    <path fill="url(#btn)" d="M 212 12 L 130 50 L 100 78 L 110 150 L 116 250 L 140 330 L 208 362 L 222 64 Z"/>
    <path fill="url(#btn)" d="M 285 10 L 300 28 L 385 80 L 408 200 L 418 300 L 420 376 L 292 356 L 276 64 Z"/>
    <path fill="#0b0c0e" d="M 224 58 L 276 58 L 288 360 L 210 364 Z"/>
    <rect x="232" y="118" width="36" height="128" rx="14" fill="url(#metal)"/>
